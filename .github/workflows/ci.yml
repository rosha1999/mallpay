name: MallPay CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mallpay
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mallpay"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mallpay?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/mallpay?schema=public
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mallpay?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev
      - run: npm run db:generate
      - run: npm run db:validate
      - run: npm run db:migrate
      - run: npm run db:status
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build
